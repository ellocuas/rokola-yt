<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Playlist de YouTube</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }

    .playlist-container {
      width: 100%;
      max-width: 800px;
    }

    .playlist-container iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <h1>🎵 Mi Playlist</h1>

  <div class="playlist-container">
    <!-- Reemplaza TU_ID_PLAYLIST con el ID real (ej: PLxxxxxxxxxxxxxxxxx) -->
    <iframe
      src="https://www.youtube.com/embed/videoseries?list=PLAciPHROzKC52lcdETGB700EDGl0B3HWM"
      title="Reproductor de playlist de YouTube"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>
  PL = PLAciPHROzKC52lcdETGB700EDGl0B3HWM
  PL = PLPGpb_eoovgD8u-jZta_IMtAiIAhkGgH5
</body>
</html>
